# Ringly Relay in Docker. Run every command from the deploy/docker directory:
#
#   docker compose run --rm relay setup     # setup (once; running it again edits the config)
#   docker compose up -d --build            # start
#   docker compose exec relay ringly-relay doctor   # check
#   docker compose exec relay ringly-relay link     # bridge link (private mode)
#   docker compose logs -f relay            # logs
#
# Host networking: TURN must see real addresses (NAT breaks ICE), and it's the simplest way for the
# bridge to open 443. If sing-box crashes, the daemon exits with an error and Docker restarts it.
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: ringly-relay:local
    # Only a local build from this repository, never someone else's image from a registry:
    # the bridge proxies other people's traffic, and the binary must match the code you can read.
    pull_policy: build
    restart: unless-stopped
    network_mode: host
    # Docker's default set already includes these; they're listed explicitly because the entrypoint
    # (chown, su-exec) and sing-box's file capability for port 443 don't work without them.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    volumes:
      - ./config:/etc/ringly-relay
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
